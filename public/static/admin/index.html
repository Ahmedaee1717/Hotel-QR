<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Guest app · Old Palace Resort</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="/static/admin/app.css">
</head>
<body>
<div id="shell">
  <nav id="sidebar" aria-label="Guest app sections">
    <div class="sb-brand">
      <div class="sb-logo" id="sb-logo"><span>OP</span></div>
      <div style="min-width:0">
        <div class="sb-hotel-name" id="sb-hotel-name">Old Palace Resort</div>
        <div class="sb-hotel-tag" data-i18n="brand.tag">Guest app</div>
      </div>
    </div>
    <div class="sb-nav" id="sb-nav"></div>
    <div class="sb-footer">
      <button class="sb-open-guest" id="sb-open-guest" type="button"><i class="fas fa-mobile-screen"></i> <span data-i18n="nav.openGuest">Open the guest app</span></button>
      <div class="sb-user">
        <div class="sb-avatar" id="sb-avatar">?</div>
        <div style="min-width:0;flex:1"><div class="sb-user-name" id="sb-user-name">—</div><div class="sb-user-role" data-i18n="nav.signedIn">Signed in</div></div>
        <button class="logout-btn" id="sb-logout" type="button" data-i18n-title="nav.logout" title="Sign out"><i class="fas fa-right-from-bracket"></i></button>
      </div>
    </div>
  </nav>
  <div id="sb-overlay"></div>
  <div id="main">
    <header class="topbar">
      <div class="topbar-left">
        <button class="tb-menu" id="tb-menu" type="button" aria-label="Menu"><i class="fas fa-bars"></i></button>
        <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
      </div>
      <div class="topbar-right">
        <div id="topbar-actions"></div>
        <button class="tb-search" id="tb-search" type="button"><i class="fas fa-magnifying-glass"></i><span data-i18n="top.find">Find anything…</span><kbd>Ctrl K</kbd></button>
        <button class="tb-help" id="tb-help" type="button"><i class="fas fa-life-ring"></i><span data-i18n="top.help">Help</span></button>
        <button class="tb-lang" id="tb-lang" type="button" title="التبديل إلى العربية">ع</button>
      </div>
    </header>
    <div id="content">
      <div id="screen" class="screen active">
        <div id="sc-head" class="sc-head"></div>
        <div id="sc-body" class="sc-body"><div id="sc-stage"></div></div>
      </div>
      <div id="embeds"></div>
    </div>
  </div>
</div>

<div id="modal-overlay" role="dialog" aria-modal="true">
  <div id="modal">
    <div class="modal-header"><div class="modal-title" id="modal-title"></div><button class="modal-close" id="modal-close" type="button" aria-label="Close"><i class="fas fa-xmark"></i></button></div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer" id="modal-footer"></div>
  </div>
</div>

<div id="cmdk" role="dialog" aria-modal="true">
  <div class="cmdk-box">
    <input class="cmdk-in" id="cmdk-in" placeholder="Type the name of a tile, a place, a dish or an info page…" autocomplete="off" aria-label="Find anything">
    <div class="cmdk-list" id="cmdk-list"></div>
  </div>
</div>

<div id="toast" aria-live="polite"></div>

<script src="/static/admin/i18n.js"></script>
<script src="/static/admin/help.js"></script>
<script src="/static/admin/editors.js"></script>
<script src="/static/admin/screens.js"></script>
<script src="/static/admin/app.js"></script>
</body>
</html>
